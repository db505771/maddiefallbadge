<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>The Hollow</title>
<style>
:root {
  --orange: #ff792f;
  --orange-light: #ffb477;
  --white: #ffffff;
  --muted: rgba(255,255,255,0.68);
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  width: 100% !important;
  height: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow: hidden;
  background: transparent !important;
  color: var(--white);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
}
body {
  position: relative;
}
button {
  font: inherit;
}
.app {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}
/* LIQUID GLASS BASE */
.liquid-glass-orange {
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border: none;
  outline: none;
  background: linear-gradient(
    135deg,
    rgba(255,224,190,0.10) 0%,
    rgba(255,190,145,0.06) 45%,
    rgba(255,155,95,0.09) 100%
  );
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  box-shadow:
    inset 0 1.5px 2px rgba(255,183,105,0.65),
    inset 0 -1px 2px rgba(255,133,55,0.35),
    0 8px 24px rgba(255,135,55,0.10);
  -webkit-mask-image: -webkit-radial-gradient(white, black);
}
.liquid-glass-orange::before {
  content: "";
  position: absolute;
  z-index: 1;
  top: 0;
  left: 4%;
  width: 92%;
  height: 42%;
  border-radius: 50%;
  background: linear-gradient(
    180deg,
    rgba(255,190,115,0.22) 0%,
    rgba(255,160,80,0.08) 38%,
    rgba(255,140,60,0) 100%
  );
  filter: blur(9px);
  pointer-events: none;
}
.liquid-glass-orange::after {
  content: "";
  position: absolute;
  z-index: 1;
  left: 8%;
  right: 8%;
  bottom: -14%;
  height: 38%;
  border-radius: 50%;
  background: rgba(255,145,55,0.08);
  filter: blur(20px);
  pointer-events: none;
}
/* HEADER */
.topbar {
  position: relative;
  z-index: 3;
  flex-shrink: 0;
  min-height: 76px;
  padding: 12px 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: transparent;
}
.brand {
  flex: 1;
  min-width: 0;
  padding-left: 4px;
}
.brand-title {
  font-size: 23px;
  line-height: 1.15;
  font-weight: 800;
  letter-spacing: -0.8px;
}
.header-actions {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 8px;
}
/* CANDY BALANCE */
.candy-balance {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-width: 77px;
  height: 43px;
  padding: 0 10px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: white;
}
.candy-icon,
.candy-number {
  position: relative;
  z-index: 2;
}
.candy-icon {
  flex-shrink: 0;
  font-size: 19px;
  line-height: 1;
}
.candy-number {
  font-size: 13px;
  line-height: 1;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
/* HEADER BUTTONS */
.icon-button {
  position: relative;
  flex-shrink: 0;
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  color: white;
  cursor: pointer;
  transition: none;
}
.icon-button:active {
  transform: none;
}
.icon-button:disabled {
  opacity: 0.7;
  cursor: default;
}
.refresh {
  font-size: 24px;
}
.info-button {
  font-size: 19px;
  font-weight: 700;
  font-family: Georgia, serif;
}
/* STATUS */
.status {
  position: relative;
  z-index: 2;
  flex-shrink: 0;
  min-height: 0;
  padding: 0 16px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}
.status.visible {
  padding-top: 7px;
  padding-bottom: 4px;
}
.status.error {
  color: #ff9b8f;
}
/* BADGE LIST */
.list {
  position: relative;
  z-index: 0;
  flex: 1;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 9px 13px 25px;
  scrollbar-width: none;
}
.list::-webkit-scrollbar {
  display: none;
}
/* BADGE CARDS */
.badge-card {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 91px;
  margin-bottom: 12px;
  padding: 17px;
  border-radius: 23px;
  border: 1px solid rgba(255,183,105,0.28);
  background: linear-gradient(
    135deg,
    rgba(255,224,190,0.10) 0%,
    rgba(255,190,145,0.06) 45%,
    rgba(255,155,95,0.09) 100%
  );
  box-shadow:
    inset 0 1.5px 2px rgba(255,183,105,0.48),
    inset 0 -1px 2px rgba(255,133,55,0.28),
    0 8px 24px rgba(255,135,55,0.07);
  -webkit-mask-image: -webkit-radial-gradient(white, black);
}
.badge-card::before {
  content: "";
  position: absolute;
  z-index: 0;
  top: 0;
  left: 4%;
  width: 92%;
  height: 42%;
  border-radius: 50%;
  background: linear-gradient(
    180deg,
    rgba(255,190,115,0.18) 0%,
    rgba(255,160,80,0.06) 38%,
    rgba(255,140,60,0) 100%
  );
  filter: blur(9px);
  pointer-events: none;
}
.badge-card::after {
  content: "";
  position: absolute;
  z-index: 0;
  left: 8%;
  right: 8%;
  bottom: -14%;
  height: 38%;
  border-radius: 50%;
  background: rgba(255,145,55,0.07);
  filter: blur(20px);
  pointer-events: none;
}
.badge-card.claimable {
  border-color: rgba(255,183,105,0.62);
  box-shadow:
    inset 0 1.5px 2px rgba(255,183,105,0.65),
    inset 0 -1px 2px rgba(255,133,55,0.35),
    0 8px 24px rgba(255,135,55,0.13);
}
.badge-info {
  position: relative;
  z-index: 2;
  flex: 1;
  min-width: 0;
}
.badge-name {
  color: white;
  font-size: 15px;
  font-weight: 750;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.badge-description {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.badge-reward {
  margin-top: 7px;
  color: #ffc08e;
  font-size: 11px;
  font-weight: 750;
}
/* CLAIM BUTTON */
.badge-action {
  position: relative;
  z-index: 2;
  isolation: isolate;
  overflow: hidden;
  flex-shrink: 0;
  min-width: 76px;
  max-width: 105px;
  padding: 11px 13px;
  border-radius: 14px;
  border: 1px solid rgba(255,183,105,0.50);
  background: linear-gradient(
    135deg,
    rgba(255,224,190,0.19),
    rgba(255,190,145,0.12),
    rgba(255,155,95,0.16)
  );
  box-shadow:
    inset 0 1.5px 2px rgba(255,183,105,0.50),
    inset 0 -1px 2px rgba(255,133,55,0.28),
    0 4px 14px rgba(255,135,55,0.09);
  color: white;
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
  transition: none;
}
.badge-action::before {
  content: "";
  position: absolute;
  z-index: -1;
  top: 0;
  left: 5%;
  width: 90%;
  height: 45%;
  border-radius: 50%;
  background: rgba(255,190,115,0.16);
  filter: blur(7px);
  pointer-events: none;
}
.badge-action:active {
  transform: none;
  background: rgba(255,175,105,0.20);
}
.badge-action:disabled {
  opacity: 0.65;
  cursor: default;
}
.earned-label,
.locked-label {
  position: relative;
  z-index: 2;
  flex-shrink: 0;
  padding: 8px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 750;
}
.earned-label {
  color: #a6f0c0;
  border: 1px solid rgba(112,221,157,0.22);
  background: rgba(65,190,119,0.10);
}
.locked-label {
  color: rgba(255,255,255,0.56);
  border: 1px solid rgba(255,183,105,0.18);
  background: rgba(255,255,255,0.045);
}
/* CLAIMED OVERLAY */
.claimed-overlay {
  position: absolute;
  z-index: 5;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(20,10,4,0.72);
  color: white;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.claimed-check {
  width: 23px;
  height: 23px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #a6f0c0;
  background: rgba(112,221,157,0.17);
  border: 1px solid rgba(112,221,157,0.18);
  font-size: 14px;
}
/* EMPTY STATE */
.empty {
  position: relative;
  z-index: 2;
  min-height: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px 20px;
  color: var(--muted);
}
.empty-symbol {
  margin-bottom: 13px;
  font-size: 30px;
  color: var(--orange-light);
}
.empty-title {
  color: white;
  font-size: 15px;
  font-weight: 750;
}
.empty-message {
  margin-top: 7px;
  max-width: 270px;
  font-size: 12px;
  line-height: 1.5;
}
/* INFO POPUP — NO BACKDROP BLUR */
.info-backdrop {
  position: fixed;
  z-index: 20;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(0,0,0,0.38);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.18s ease, visibility 0.18s ease;
}
.info-backdrop.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.info-panel {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  max-width: 340px;
  padding: 25px 22px 23px;
  border-radius: 25px;
  border: 1px solid rgba(255,183,105,0.38);
  background: linear-gradient(
    135deg,
    rgba(255,224,190,0.15) 0%,
    rgba(255,190,145,0.10) 45%,
    rgba(255,155,95,0.14) 100%
  );
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  box-shadow:
    inset 0 1.5px 2px rgba(255,183,105,0.55),
    inset 0 -1px 2px rgba(255,133,55,0.30),
    0 15px 50px rgba(0,0,0,0.25);
  transform: translateY(5px);
  transition: transform 0.18s ease;
}
.info-backdrop.open .info-panel {
  transform: translateY(0);
}
.info-panel::before {
  content: "";
  position: absolute;
  z-index: 0;
  top: 0;
  left: 4%;
  width: 92%;
  height: 42%;
  border-radius: 50%;
  background: linear-gradient(
    180deg,
    rgba(255,190,115,0.22) 0%,
    rgba(255,160,80,0.08) 38%,
    rgba(255,140,60,0) 100%
  );
  filter: blur(9px);
  pointer-events: none;
}
.info-panel::after {
  content: "";
  position: absolute;
  z-index: 0;
  left: 8%;
  right: 8%;
  bottom: -14%;
  height: 38%;
  border-radius: 50%;
  background: rgba(255,145,55,0.08);
  filter: blur(20px);
  pointer-events: none;
}
.info-title,
.info-message {
  position: relative;
  z-index: 2;
}
.info-title {
  margin: 0 43px 13px 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.4px;
}
.info-message {
  margin: 0;
  color: rgba(255,255,255,0.88);
  font-size: 14px;
  line-height: 1.65;
}
/* LIQUID-GLASS CLOSE BUTTON — NO ANIMATION */
.info-close {
  position: absolute;
  z-index: 3;
  top: 12px;
  right: 12px;
  isolation: isolate;
  overflow: hidden;
  width: 36px;
  height: 36px;
  padding: 0;
  display: grid;
  place-items: center;
  border: none;
  outline: none;
  border-radius: 13px;
  color: white;
  font-size: 23px;
  line-height: 1;
  background: linear-gradient(
    135deg,
    rgba(255,224,190,0.10) 0%,
    rgba(255,190,145,0.06) 45%,
    rgba(255,155,95,0.09) 100%
  );
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  box-shadow:
    inset 0 1.5px 2px rgba(255,183,105,0.65),
    inset 0 -1px 2px rgba(255,133,55,0.35),
    0 8px 24px rgba(255,135,55,0.10);
  cursor: pointer;
  transition: none;
}
.info-close::before {
  content: "";
  position: absolute;
  z-index: -1;
  top: 0;
  left: 4%;
  width: 92%;
  height: 42%;
  border-radius: 50%;
  background: linear-gradient(
    180deg,
    rgba(255,190,115,0.22) 0%,
    rgba(255,160,80,0.08) 38%,
    rgba(255,140,60,0) 100%
  );
  filter: blur(9px);
  pointer-events: none;
}
.info-close::after {
  content: "";
  position: absolute;
  z-index: -1;
  left: 8%;
  right: 8%;
  bottom: -14%;
  height: 38%;
  border-radius: 50%;
  background: rgba(255,145,55,0.08);
  filter: blur(20px);
  pointer-events: none;
}
.info-close:active {
  transform: none;
}
/* TOAST */
.toast {
  position: fixed;
  z-index: 30;
  left: 50%;
  bottom: 24px;
  width: max-content;
  max-width: calc(100% - 32px);
  padding: 12px 17px;
  border: 1px solid rgba(255,183,105,0.30);
  border-radius: 16px;
  background: linear-gradient(
    135deg,
    rgba(255,224,190,0.15),
    rgba(255,190,145,0.09),
    rgba(255,155,95,0.12)
  );
  box-shadow:
    inset 0 1px 2px rgba(255,183,105,0.30),
    0 8px 24px rgba(255,135,55,0.10);
  color: white;
  font-size: 12px;
  font-weight: 650;
  text-align: center;
  opacity: 0;
  transform: translate(-50%, 10px);
  pointer-events: none;
  transition: opacity 0.2s;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
@media (max-width: 360px) {
  .topbar {
    padding-right: 10px;
    padding-left: 10px;
    gap: 6px;
  }
  .brand-title {
    font-size: 20px;
  }
  .header-actions {
    gap: 6px;
  }
  .candy-balance {
    min-width: 67px;
    height: 41px;
    padding: 0 8px;
    gap: 5px;
  }
  .candy-number {
    font-size: 12px;
  }
  .icon-button {
    width: 39px;
    height: 41px;
  }
  .badge-card {
    gap: 9px;
    padding: 14px;
  }
  .badge-name {
    font-size: 14px;
  }
  .badge-action {
    min-width: 65px;
    padding: 10px 8px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .info-backdrop,
  .info-panel,
  .toast {
    transition: none !important;
  }
}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">The Hollow</div>
    </div>
<div class="header-actions">
  <div class="candy-balance liquid-glass-orange" aria-label="Candy balance">
    <span class="candy-icon" aria-hidden="true">🍬</span>
    <span class="candy-number" id="candyBalance">0</span>
  </div>
  <button
    class="icon-button refresh liquid-glass-orange"
    id="refreshButton"
    aria-label="Refresh badges"
    type="button"
  >↻</button>
  <button
    class="icon-button info-button liquid-glass-orange"
    id="infoButton"
    aria-label="Event information"
    type="button"
  >i</button>
</div>
  </header>
  <div id="status" class="status"></div>
  <section id="badgeList" class="list" aria-live="polite"></section>
</main>
<div class="info-backdrop" id="infoBackdrop" role="presentation">
  <section
    class="info-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="infoTitle"
    aria-describedby="infoMessage"
  >
    <button
      class="info-close"
      id="infoClose"
      type="button"
      aria-label="Close information"
    >×</button>
<h2 class="info-title" id="infoTitle">The Hollow Event</h2>
<p class="info-message" id="infoMessage">
  Join the Roblox Hollow event, complete the floors to earn badges, badges can be exchanged for candy.
</p>
  </section>
</div>
<div id="toast" class="toast" role="status"></div>
<script>
"use strict";
const API_URL = "https://script.google.com/macros/s/AKfycbzoXK1oaVE9UUo5PurgJDFsGDagggu8vaauoXBHJquqoa49WEY4WIOM_erPnZbW-HjMjQ/exec";
const listElement = document.getElementById("badgeList");
const statusElement = document.getElementById("status");
const refreshButton = document.getElementById("refreshButton");
const toastElement = document.getElementById("toast");
const candyBalanceElement = document.getElementById("candyBalance");
const infoButton = document.getElementById("infoButton");
const infoBackdrop = document.getElementById("infoBackdrop");
const infoClose = document.getElementById("infoClose");
let allBadges = [];
let loading = false;
let toastTimer = null;
function getBadgeId(badge) {
  return String(badge.badgeId || badge.id || "").trim();
}
function makeUrl(action, parameters) {
  const url = new URL(API_URL);
  url.searchParams.set("action", action);
  Object.keys(parameters || {}).forEach(function(key) {
    url.searchParams.set(key, String(parameters[key]));
  });
  return url.toString();
}
async function requestJson(url) {
  const response = await fetch(url, {
    method: "GET",
    cache: "no-store",
    redirect: "follow"
  });
  const text = await response.text();
  if (!response.ok) {
    throw new Error("Server error: " + response.status);
  }
  try {
    return JSON.parse(text);
  } catch (error) {
    throw new Error(
      "The server did not return JSON. Check your Apps Script deployment."
    );
  }
}
function escapeHtml(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, function(character) {
    const replacements = {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    };
    return replacements[character];
  });
}
function isEarned(badge) {
  return badge.earned === true ||
    badge.earned === "true" ||
    badge.earned === 1 ||
    badge.earned === "1";
}
function isClaimed(badge) {
  return badge.claimed === true ||
    badge.claimed === "true" ||
    badge.claimed === 1 ||
    badge.claimed === "1";
}
function formatNumber(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) {
    return "0";
  }
  return number.toLocaleString();
}
function updateCandyBalance(value) {
  candyBalanceElement.textContent = formatNumber(value);
}
function showStatus(message, type) {
  statusElement.textContent = message || "";
  statusElement.className = "status";
  if (message) {
    statusElement.classList.add("visible");
  }
  if (type) {
    statusElement.classList.add(type);
  }
}
function showToast(message) {
  toastElement.textContent = message;
  toastElement.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    toastElement.classList.remove("show");
  }, 2800);
}
/* INFO POPUP */
function openInfo() {
  infoBackdrop.classList.add("open");
}
function closeInfo() {
  infoBackdrop.classList.remove("open");
}
infoButton.addEventListener("click", openInfo);
infoClose.addEventListener("click", closeInfo);
infoBackdrop.addEventListener("click", function(event) {
  if (event.target === infoBackdrop) {
    closeInfo();
  }
});
document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    closeInfo();
  }
});
/* BADGE SORTING */
function sortBadges(badges) {
  return badges.slice().sort(function(a, b) {
    const aClaimed = isClaimed(a);
    const bClaimed = isClaimed(b);
    if (aClaimed !== bClaimed) {
      return aClaimed ? 1 : -1;
    }
    const aEarned = isEarned(a);
    const bEarned = isEarned(b);
    if (aEarned !== bEarned) {
      return aEarned ? -1 : 1;
    }
    return String(a.name || "").localeCompare(String(b.name || ""));
  });
}
/* DRAW BADGE LIST */
function renderBadges() {
  listElement.replaceChildren();
  if (!allBadges.length) {
    listElement.innerHTML = `
      <div class="empty">
        <div class="empty-symbol">◇</div>
        <div class="empty-title">No badges found</div>
        <div class="empty-message">
          No badges were returned. Tap refresh to try again.
        </div>
      </div>
    `;
    return;
  }
  const fragment = document.createDocumentFragment();
  sortBadges(allBadges).forEach(function(badge) {
    fragment.appendChild(createCard(badge));
  });
  listElement.appendChild(fragment);
}
function createCard(badge) {
  const earned = isEarned(badge);
  const claimed = isClaimed(badge);
  const badgeId = getBadgeId(badge);
  const reward = Number(badge.candyReward || 0);
  const card = document.createElement("article");
  card.className = "badge-card";
  if (earned && !claimed) {
    card.classList.add("claimable");
  }
  let actionHtml = "";
  if (claimed) {
    actionHtml = '<span class="earned-label">Claimed</span>';
  } else if (earned) {
    actionHtml = '<button class="badge-action" type="button">Claim</button>';
  } else {
    actionHtml = '<span class="locked-label">Locked</span>';
  }
  card.innerHTML = `
    <div class="badge-info">
      <div class="badge-name">${escapeHtml(badge.name || "Badge")}</div>
      ${
        badge.description
          ? `<div class="badge-description">${escapeHtml(badge.description)}</div>`
          : ""
      }
      ${
        earned && !claimed
          ? `<div class="badge-reward">+${escapeHtml(formatNumber(reward))} Candy</div>`
          : ""
      }
    </div>
    ${actionHtml}
  `;
  if (earned && !claimed) {
    const button = card.querySelector(".badge-action");
    button.addEventListener("click", function() {
      claimReward(badge, button);
    });
  }
  if (claimed) {
    const overlay = document.createElement("div");
    overlay.className = "claimed-overlay";
    overlay.innerHTML = `
      <span class="claimed-check">✓</span>
      <span>Reward Claimed</span>
    `;
    card.appendChild(overlay);
  }
  card.dataset.badgeId = badgeId;
  return card;
}
/* LOAD CANDY BALANCE */
async function refreshCandyBalance() {
  try {
    const data = await requestJson(makeUrl("getCandy"));
    if (data.success === true) {
      updateCandyBalance(data.candy || 0);
    }
  } catch (error) {
    console.error("Candy balance error:", error);
  }
}
/* LOAD BADGES */
async function loadBadges() {
  if (loading) {
    return;
  }
  loading = true;
  refreshButton.disabled = true;
  showStatus("Checking Roblox badge ownership…");
  try {
    const data = await requestJson(makeUrl("checkBadges"));
    if (data.success === false) {
      throw new Error(data.error || "Could not load badges.");
    }
    if (!Array.isArray(data.badges)) {
      throw new Error("The server response did not contain a badge list.");
    }
    allBadges = data.badges.map(function(badge) {
      return Object.assign({}, badge, {
        badgeId: getBadgeId(badge)
      });
    });
    if (typeof data.candy !== "undefined") {
      updateCandyBalance(data.candy);
    } else {
      await refreshCandyBalance();
    }
    renderBadges();
    showStatus("");
  } catch (error) {
    console.error("Badge loading error:", error);
    showStatus(error.message || "Could not load badges.", "error");
    if (!allBadges.length) {
      listElement.innerHTML = `
        <div class="empty">
          <div class="empty-symbol">!</div>
          <div class="empty-title">Couldn't load badges</div>
          <div class="empty-message">${escapeHtml(error.message || "Please try again.")}</div>
        </div>
      `;
    }
  } finally {
    loading = false;
    refreshButton.disabled = false;
  }
}
/* CLAIM CANDY REWARD */
async function claimReward(badge, button) {
  const badgeId = getBadgeId(badge);
  if (!badgeId) {
    showToast("This badge has no valid ID.");
    return;
  }
  if (button.disabled) {
    return;
  }
  button.disabled = true;
  button.textContent = "Claiming…";
  try {
    const data = await requestJson(
      makeUrl("claimBadge", {
        badgeId: badgeId
      })
    );
    if (data.success !== true) {
      throw new Error(
        data.error || data.message || "The reward could not be claimed."
      );
    }
    allBadges = allBadges.map(function(item) {
      if (getBadgeId(item) === badgeId) {
        return Object.assign({}, item, {
          claimed: true,
          earned: true
        });
      }
      return item;
    });
    if (typeof data.candy !== "undefined") {
      updateCandyBalance(data.candy);
    } else {
      await refreshCandyBalance();
    }
    renderBadges();
    if (data.alreadyClaimed) {
      showToast("This reward was already claimed.");
    } else {
      const awarded = Number(data.candyAwarded || 0);
      showToast("+" + formatNumber(awarded) + " Candy earned!");
    }
  } catch (error) {
    console.error("Badge claim error:", error);
    showToast(error.message || "Claim failed.");
    button.disabled = false;
    button.textContent = "Claim";
  }
}
/* REFRESH — NO SPIN ANIMATION */
refreshButton.addEventListener("click", loadBadges);
/* INITIAL LOAD */
loadBadges();
refreshCandyBalance();
</script>
</body>
