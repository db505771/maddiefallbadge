<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>The Hollow</title>
<style>
:root {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "Helvetica Neue", Arial, sans-serif;
}
* {
  box-sizing: border-box;
}
html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  color: white;
  background: transparent !important;
  overflow: hidden;
}
body {
  display: flex;
  flex-direction: column;
}
/* FIXED HEADER */
.header {
  position: relative;
  z-index: 20;
  flex: 0 0 auto;
  padding: 17px 16px 13px;
  background: transparent !important;
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.title {
  margin: 0;
  color: #fff;
  font-size: 27px;
  font-weight: 750;
  letter-spacing: -1px;
}
.refresh-button {
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  padding: 10px 16px;
  border: 1px solid rgba(255, 190, 130, .48);
  border-radius: 14px;
  color: #fff;
  background: linear-gradient(
    135deg,
    rgba(255, 190, 110, .28),
    rgba(255, 125, 35, .13),
    rgba(255, 180, 100, .20)
  );
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  box-shadow:
    inset 0 1.5px 1px rgba(255, 245, 225, .55),
    inset 0 -2px 4px rgba(255, 120, 25, .18),
    0 5px 18px rgba(255, 130, 40, .12);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.refresh-button::before {
  content: "";
  position: absolute;
  top: 0;
  left: 10%;
  width: 80%;
  height: 48%;
  border-radius: 50%;
  background: rgba(255, 235, 210, .27);
  filter: blur(9px);
  pointer-events: none;
}
.refresh-button:active {
  transform: scale(.96);
}
.refresh-button:disabled {
  opacity: .6;
}
.status {
  margin-top: 8px;
  min-height: 14px;
  color: rgba(255, 255, 255, .67);
  font-size: 11px;
}
/* ONLY THE BADGES SCROLL */
.badge-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  padding: 0 16px 28px;
  background: transparent !important;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.badge-scroll::-webkit-scrollbar {
  display: none;
}
.badge-list {
  display: flex;
  flex-direction: column;
  gap: 11px;
  background: transparent !important;
}
/* SECTION LABELS */
.section-label {
  margin: 12px 2px 1px;
  color: rgba(255, 218, 188, .92);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.7px;
  text-transform: uppercase;
}
.section-label:first-child {
  margin-top: 3px;
}
/* LIQUID GLASS BADGE CARDS */
.badge-card {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: 16px;
  border: 1px solid rgba(255, 255, 255, .19);
  border-radius: 19px;
  /* Transparent glass, not a black background */
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, .105) 0%,
    rgba(255, 255, 255, .035) 42%,
    rgba(255, 170, 100, .055) 100%
  );
  backdrop-filter: blur(22px) saturate(175%);
  -webkit-backdrop-filter: blur(22px) saturate(175%);
  box-shadow:
    inset 0 1.5px 1px rgba(255, 255, 255, .23),
    inset 0 -1px 1px rgba(255, 255, 255, .035),
    0 8px 24px rgba(0, 0, 0, .035);
}
.badge-card::before {
  content: "";
  position: absolute;
  z-index: -1;
  top: -30px;
  left: 8%;
  width: 84%;
  height: 65px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .085);
  filter: blur(19px);
  pointer-events: none;
}
.badge-name {
  margin: 0;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.badge-id {
  margin-top: 5px;
  color: rgba(255, 255, 255, .62);
  font-size: 11px;
  overflow-wrap: anywhere;
}
/* ORANGE GLASS FOR CLAIMABLE REWARDS */
.badge-card.claimable {
  border-color: rgba(255, 169, 99, .46);
  background: linear-gradient(
    135deg,
    rgba(255, 200, 145, .16) 0%,
    rgba(255, 140, 55, .095) 48%,
    rgba(255, 190, 120, .10) 100%
  );
  box-shadow:
    inset 0 1.5px 1px rgba(255, 225, 190, .36),
    inset 0 -1px 2px rgba(255, 135, 45, .12),
    0 7px 22px rgba(255, 130, 40, .08);
}
/* LIQUID GLASS CLAIM BUTTON */
.claim-button {
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: inline-block;
  margin-top: 13px;
  padding: 10px 20px;
  border: 1px solid rgba(255, 208, 163, .53);
  border-radius: 14px;
  color: #fff !important;
  -webkit-text-fill-color: #fff;
  background: linear-gradient(
    135deg,
    rgba(255, 220, 180, .31) 0%,
    rgba(255, 155, 75, .20) 45%,
    rgba(255, 120, 35, .16) 100%
  );
  backdrop-filter: blur(25px) saturate(190%);
  -webkit-backdrop-filter: blur(25px) saturate(190%);
  box-shadow:
    inset 0 1.5px 1px rgba(255, 245, 225, .72),
    inset 0 -2px 3px rgba(255, 112, 25, .25),
    0 5px 17px rgba(255, 128, 40, .17);
  font-size: 12px;
  font-weight: 750;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .15s ease, opacity .15s ease;
}
.claim-button::before {
  content: "";
  position: absolute;
  z-index: -1;
  top: -4px;
  left: 5%;
  width: 90%;
  height: 60%;
  border-radius: 50%;
  background: linear-gradient(
    180deg,
    rgba(255, 246, 226, .48),
    rgba(255, 190, 125, .17),
    transparent
  );
  filter: blur(8px);
  pointer-events: none;
}
.claim-button::after {
  content: "";
  position: absolute;
  top: 1px;
  left: 10%;
  width: 80%;
  height: 1px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .58);
  filter: blur(.5px);
  pointer-events: none;
}
.claim-button:active {
  transform: scale(.96);
}
.claim-button:disabled {
  opacity: .6;
  cursor: default;
}
/* CLAIMED CARDS */
.badge-card.claimed {
  opacity: .48;
  filter: grayscale(.65);
}
.claimed-overlay {
  position: absolute;
  z-index: 3;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: inherit;
  background: rgba(25, 15, 10, .13);
  pointer-events: none;
}
.claimed-label {
  padding: 8px 15px;
  border: 1px solid rgba(255, 255, 255, .26);
  border-radius: 11px;
  color: white;
  background: rgba(50, 35, 25, .35);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  font-size: 11px;
  font-weight: 850;
  letter-spacing: 2px;
}
.message {
  padding: 24px 12px;
  color: rgba(255, 255, 255, .75);
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
  background: transparent !important;
}
</style>
</head>
<body>
<header class="header">
  <div class="header-row">
    <h1 class="title">The Hollow</h1>
    <button class="refresh-button" id="refreshButton" type="button">
      Refresh
    </button>
  </div>
  <div class="status" id="status">Loading badge catalog...</div>
</header>
<main class="badge-scroll" id="badgeScroll">
  <div class="badge-list" id="badgeList">
    <div class="message">Loading badges...</div>
  </div>
</main>
<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycbzoXK1oaVE9UUo5PurgJDFsGDagggu8vaauoXBHJquqoa49WEY4WIOM_erPnZbW-HjMjQ/exec";
const badgeList = document.getElementById("badgeList");
const statusText = document.getElementById("status");
const refreshButton = document.getElementById("refreshButton");
let loading = false;
let cachedBadges = [];
function apiRequest(action, params = {}) {
  return new Promise((resolve, reject) => {
    const callbackName =
      "hollowCallback_" + Date.now() + "_" +
      Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    const query = new URLSearchParams({
      action: action,
      callback: callbackName,
      ...params
    });
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("Request timed out. Please try again."));
    }, 30000);
    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
    }
    window[callbackName] = data => {
      cleanup();
      if (!data) {
        reject(new Error("No response from the server."));
        return;
      }
      if (data.success === false) {
        reject(new Error(data.error || "The request failed."));
        return;
      }
      resolve(data);
    };
    script.onerror = () => {
      cleanup();
      reject(new Error("Connection failed. Please try again."));
    };
    script.src = API_URL + "?" + query.toString();
    document.body.appendChild(script);
  });
}
function badgeId(badge) {
  return String(badge.badgeId ?? badge.id ?? "");
}
function badgeName(badge) {
  return String(badge.name ?? "Unnamed Badge");
}
function isEarned(badge) {
  return badge.earned === true ||
         badge.earned === "true" ||
         badge.earned === 1;
}
function isClaimed(badge) {
  return badge.claimed === true ||
         badge.claimed === "true" ||
         badge.claimed === 1;
}
function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
function renderBadges(badges) {
  cachedBadges = [...badges];
  const claimable = badges
    .filter(b => isEarned(b) && !isClaimed(b))
    .sort((a, b) => badgeName(a).localeCompare(badgeName(b)));
  const other = badges
    .filter(b => !isEarned(b) && !isClaimed(b))
    .sort((a, b) => badgeName(a).localeCompare(badgeName(b)));
  const claimed = badges
    .filter(b => isClaimed(b))
    .sort((a, b) => badgeName(a).localeCompare(badgeName(b)));
  badgeList.replaceChildren();
  function addSection(title, items) {
    if (!items.length) return;
    const label = document.createElement("div");
    label.className = "section-label";
    label.textContent = title;
    badgeList.appendChild(label);
    items.forEach(badge => {
      const card = document.createElement("article");
      const earned = isEarned(badge);
      const isClaimedBadge = isClaimed(badge);
      const canClaim = earned && !isClaimedBadge;
      card.className = "badge-card";
      if (canClaim) card.classList.add("claimable");
      if (isClaimedBadge) card.classList.add("claimed");
      const name = document.createElement("h2");
      name.className = "badge-name";
      name.textContent = badgeName(badge);
      card.appendChild(name);
      const id = document.createElement("div");
      id.className = "badge-id";
      id.textContent = "ID: " + badgeId(badge);
      card.appendChild(id);
      if (canClaim) {
        const button = document.createElement("button");
        button.className = "claim-button";
        button.type = "button";
        button.textContent = "Claim Reward";
        button.addEventListener("click", () => {
          claimReward(badgeId(badge), button);
        });
        card.appendChild(button);
      }
      if (isClaimedBadge) {
        const overlay = document.createElement("div");
        overlay.className = "claimed-overlay";
        const label = document.createElement("span");
        label.className = "claimed-label";
        label.textContent = "CLAIMED";
        overlay.appendChild(label);
        card.appendChild(overlay);
      }
      badgeList.appendChild(card);
    });
  }
  addSection("Claimable Rewards", claimable);
  addSection("Other Badges", other);
  addSection("Claimed Rewards", claimed);
  if (!badges.length) {
    badgeList.innerHTML =
      '<div class="message">No badges were returned for The Hollow.</div>';
  }
}
async function loadBadges() {
  if (loading) return;
  loading = true;
  refreshButton.disabled = true;
  refreshButton.textContent = "Loading...";
  statusText.textContent = "Checking badge ownership...";
  try {
    /*
      IMPORTANT:
      allBadges only loads the catalog.
      checkBadges checks actual Roblox ownership.
    */
    const response = await apiRequest("checkBadges");
    if (!Array.isArray(response.badges)) {
      throw new Error(
        "The server did not return a badges list. Check your Apps Script deployment."
      );
    }
    renderBadges(response.badges);
    const claimableCount = response.badges.filter(
      b => isEarned(b) && !isClaimed(b)
    ).length;
    const claimedCount = response.badges.filter(
      b => isClaimed(b)
    ).length;
    statusText.textContent =
      response.badges.length + " badges · " +
      claimableCount + " claimable · " +
      claimedCount + " claimed";
  } catch (error) {
    statusText.textContent = "Couldn't load badges.";
    badgeList.innerHTML = "";
    const message = document.createElement("div");
    message.className = "message";
    message.textContent = error.message;
    badgeList.appendChild(message);
  } finally {
    loading = false;
    refreshButton.disabled = false;
    refreshButton.textContent = "Refresh";
  }
}
async function claimReward(id, button) {
  if (!id || button.disabled) return;
  button.disabled = true;
  button.textContent = "Claiming...";
  try {
    const result = await apiRequest("claimBadge", { badgeId: id });
    if (result.success !== true || result.claimed !== true) {
      throw new Error(result.error || "The reward could not be claimed.");
    }
    statusText.textContent = "Reward claimed! Updating badges...";
    await loadBadges();
  } catch (error) {
    button.disabled = false;
    button.textContent = "Claim Reward";
    statusText.textContent = error.message;
  }
}
refreshButton.addEventListener("click", loadBadges);
loadBadges();
</script>
</body>
</html>
