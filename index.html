<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Hollow</title>
<style>
:root {
  --orange: #ff7a18;
  --orange-light: #ffab58;
  --text: #ffffff;
  --muted: rgba(255,255,255,0.58);
  --glass: rgba(255,130,35,0.12);
  --border: rgba(255,155,75,0.28);
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "Segoe UI", Arial, sans-serif;
}
body {
  position: relative;
}
body::before {
  content: "";
  position: fixed;
  width: 230px;
  height: 230px;
  top: -110px;
  right: -90px;
  border-radius: 50%;
  background: rgba(255,111,24,0.12);
  filter: blur(55px);
  pointer-events: none;
}
body::after {
  content: "";
  position: fixed;
  width: 190px;
  height: 190px;
  bottom: -100px;
  left: -90px;
  border-radius: 50%;
  background: rgba(255,145,48,0.09);
  filter: blur(55px);
  pointer-events: none;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}
header {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 17px 16px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: rgba(20,14,10,0.16);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
}
.brand {
  min-width: 0;
}
.brand h1 {
  margin: 0;
  font-size: 24px;
  line-height: 1.1;
  font-weight: 750;
  letter-spacing: -0.8px;
}
.brand p {
  margin: 5px 0 0;
  font-size: 11px;
  letter-spacing: 2.2px;
  text-transform: uppercase;
  color: var(--orange-light);
  font-weight: 700;
}
.refresh {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 10px 13px;
  color: white;
  background: linear-gradient(
    135deg,
    rgba(255,146,54,0.24),
    rgba(255,95,15,0.09)
  );
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
  font: inherit;
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
}
.refresh:active {
  transform: scale(0.96);
}
.refresh svg {
  width: 15px;
  height: 15px;
}
#status {
  flex: 0 0 auto;
  padding: 9px 16px 0;
  min-height: 22px;
  color: var(--muted);
  font-size: 11px;
}
#status.error {
  color: #ff9d88;
}
#badgeList {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 13px 25px;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#badgeList::-webkit-scrollbar {
  display: none;
}
.badge-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 100px;
  margin-bottom: 11px;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 21px;
  overflow: hidden;
  background: linear-gradient(
    135deg,
    rgba(255,139,43,0.17),
    rgba(255,255,255,0.035) 55%,
    rgba(255,91,18,0.09)
  );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.11),
    0 7px 25px rgba(0,0,0,0.08);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  animation: appear 0.3s ease both;
}
.badge-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 15px;
  right: 15px;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,190,125,0.55),
    transparent
  );
  pointer-events: none;
}
.badge-card.claimable {
  border-color: rgba(255,154,67,0.62);
  background: linear-gradient(
    125deg,
    rgba(255,126,29,0.25),
    rgba(255,255,255,0.055),
    rgba(255,100,17,0.15)
  );
}
.badge-card.claimed {
  opacity: 0.7;
}
.badge-icon {
  width: 65px;
  height: 65px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 17px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.13);
  background: rgba(0,0,0,0.18);
}
.badge-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.badge-icon .fallback {
  color: var(--orange-light);
  font-size: 25px;
  font-weight: 800;
}
.badge-info {
  min-width: 0;
  flex: 1;
  align-self: center;
  padding: 2px 0;
}
.badge-name {
  font-size: 14px;
  line-height: 1.35;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.badge-description {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.badge-action {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.claim-button {
  border: 0;
  border-radius: 13px;
  padding: 11px 12px;
  min-width: 65px;
  color: #241006;
  background: linear-gradient(135deg, #ffbd79, #ff7b20);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.5),
    0 4px 15px rgba(255,111,24,0.17);
  font: inherit;
  font-size: 11px;
  font-weight: 850;
  letter-spacing: 0.4px;
  cursor: pointer;
}
.claim-button:active {
  transform: scale(0.94);
}
.claim-button:disabled {
  opacity: 0.55;
  cursor: wait;
}
.earned-tag {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.8px;
  color: #ffbf86;
}
.claimed-overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: inherit;
  background: rgba(12,8,5,0.53);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  color: white;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 3px;
  text-shadow: 0 0 18px rgba(255,130,45,0.7);
  pointer-events: none;
}
#emptyState {
  display: none;
  text-align: center;
  padding: 45px 20px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}
#emptyState strong {
  display: block;
  color: white;
  font-size: 16px;
  margin-bottom: 6px;
}
#retryButton {
  display: none;
  margin: 15px auto 0;
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: white;
  background: var(--glass);
  font: inherit;
  font-size: 12px;
}
@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(7px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@media (max-width: 350px) {
  header {
    padding-left: 12px;
    padding-right: 12px;
  }
  .brand h1 {
    font-size: 21px;
  }
  #badgeList {
    padding-left: 9px;
    padding-right: 9px;
  }
  .badge-card {
    gap: 9px;
    padding: 10px;
  }
  .badge-icon {
    width: 53px;
    height: 53px;
  }
  .claim-button {
    min-width: 56px;
    padding: 10px 8px;
  }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>The Hollow</h1>
      <p>Badge Collection</p>
    </div>
    <button class="refresh" id="refreshButton" type="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 7v5h-5" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19 12a7 7 0 1 1-2-5" stroke="currentColor"
          stroke-width="2" stroke-linecap="round"/>
      </svg>
      Refresh
    </button>
  </header>
  <div id="status" aria-live="polite"></div>
  <main id="badgeList">
    <div id="emptyState">
      <strong id="emptyTitle">Loading badges...</strong>
      <span id="emptyMessage">Please wait.</span>
      <button id="retryButton" type="button">Try again</button>
    </div>
  </main>
</div>
<script>
(function () {
  "use strict";
  var API_URL =
    "https://script.google.com/macros/s/AKfycbzoXK1oaVE9UUo5PurgJDFsGDagggu8vaauoXBHJquqoa49WEY4WIOM_erPnZbW-HjMjQ/exec";
  var badgeList = document.getElementById("badgeList");
  var statusBox = document.getElementById("status");
  var refreshButton = document.getElementById("refreshButton");
  var emptyState = document.getElementById("emptyState");
  var emptyTitle = document.getElementById("emptyTitle");
  var emptyMessage = document.getElementById("emptyMessage");
  var retryButton = document.getElementById("retryButton");
  var currentBadges = [];
  var loading = false;
  function setStatus(message, isError) {
    statusBox.textContent = message || "";
    statusBox.className = isError ? "error" : "";
  }
  function showEmpty(title, message, showRetry) {
    emptyTitle.textContent = title;
    emptyMessage.textContent = message;
    emptyState.style.display = "block";
    retryButton.style.display = showRetry ? "inline-block" : "none";
  }
  function hideEmpty() {
    emptyState.style.display = "none";
  }
  function requestJson(url) {
    return fetch(url, {
      method: "GET",
      redirect: "follow",
      cache: "no-store"
    }).then(function (response) {
      if (!response.ok) {
        throw new Error("Request failed. Please try again.");
      }
      return response.text();
    }).then(function (text) {
      try {
        return JSON.parse(text);
      } catch (error) {
        throw new Error(
          "The server did not return valid JSON. Check your Apps Script deployment."
        );
      }
    });
  }
  function makeUrl(action, extra) {
    var url = API_URL + "?action=" + encodeURIComponent(action);
    if (extra) {
      Object.keys(extra).forEach(function (key) {
        url += "&" + encodeURIComponent(key) +
          "=" + encodeURIComponent(extra[key]);
      });
    }
    url += "&_=" + Date.now();
    return url;
  }
  function makeIcon(badge) {
    var box = document.createElement("div");
    box.className = "badge-icon";
    var iconId = Number(badge.iconImageId || 0);
    if (iconId > 0) {
      var image = document.createElement("img");
      image.alt = "";
      image.loading = "lazy";
      image.src =
        "https://thumbnails.roblox.com/v1/badges/icons?badgeIds=" +
        encodeURIComponent(String(badge.id)) +
        "&size=150x150&format=Png&isCircular=false";
      image.onerror = function () {
        box.innerHTML = "";
        var fallback = document.createElement("span");
        fallback.className = "fallback";
        fallback.textContent = "H";
        box.appendChild(fallback);
      };
      image.onload = function () {
        if (image.naturalWidth === 0) {
          image.onerror();
        }
      };
      /*
        Roblox's thumbnail endpoint returns JSON, not a direct image.
        Use the dedicated helper below to resolve the actual image URL.
      */
      box.appendChild(image);
      loadBadgeImage(badge.id, image, box);
    } else {
      var fallback = document.createElement("span");
      fallback.className = "fallback";
      fallback.textContent = "H";
      box.appendChild(fallback);
    }
    return box;
  }
  function loadBadgeImage(badgeId, image, box) {
    var url =
      "https://thumbnails.roblox.com/v1/badges/icons?badgeIds=" +
      encodeURIComponent(String(badgeId)) +
      "&size=150x150&format=Png&isCircular=false";
    fetch(url).then(function (response) {
      if (!response.ok) {
        throw new Error("Could not load badge image.");
      }
      return response.json();
    }).then(function (data) {
      if (data.data && data.data.length && data.data[0].imageUrl) {
        image.src = data.data[0].imageUrl;
      } else {
        throw new Error("Badge image unavailable.");
      }
    }).catch(function () {
      box.innerHTML = "";
      var fallback = document.createElement("span");
      fallback.className = "fallback";
      fallback.textContent = "H";
      box.appendChild(fallback);
    });
  }
  function createCard(badge) {
    var earned = badge.earned === true;
    var claimed = badge.claimed === true;
    var claimable = earned && !claimed;
    var card = document.createElement("article");
    card.className = "badge-card";
    if (claimable) {
      card.classList.add("claimable");
    }
    if (claimed) {
      card.classList.add("claimed");
    }
    card.appendChild(makeIcon(badge));
    var info = document.createElement("div");
    info.className = "badge-info";
    var name = document.createElement("div");
    name.className = "badge-name";
    name.textContent = badge.name || "Unnamed Badge";
    info.appendChild(name);
    if (badge.description) {
      var description = document.createElement("div");
      description.className = "badge-description";
      description.textContent = badge.description;
      info.appendChild(description);
    }
    card.appendChild(info);
    var action = document.createElement("div");
    action.className = "badge-action";
    if (claimable) {
      var button = document.createElement("button");
      button.type = "button";
      button.className = "claim-button";
      button.textContent = "CLAIM";
      button.addEventListener("click", function () {
        claimReward(badge, button);
      });
      action.appendChild(button);
    } else if (earned && !claimed) {
      var tag = document.createElement("span");
      tag.className = "earned-tag";
      tag.textContent = "EARNED";
      action.appendChild(tag);
    }
    if (!claimed) {
      card.appendChild(action);
    } else {
      var overlay = document.createElement("div");
      overlay.className = "claimed-overlay";
      overlay.textContent = "CLAIMED";
      card.appendChild(overlay);
    }
    return card;
  }
  function renderBadges(badges) {
    currentBadges = badges.slice();
    currentBadges.sort(function (a, b) {
      function rank(item) {
        if (item.claimed === true) {
          return 2;
        }
        if (item.earned === true) {
          return 0;
        }
        return 1;
      }
      return rank(a) - rank(b);
    });
    var oldCards = badgeList.querySelectorAll(".badge-card");
    oldCards.forEach(function (card) {
      card.remove();
    });
    if (!currentBadges.length) {
      showEmpty(
        "No badges found",
        "There are no badges to display right now.",
        true
      );
      return;
    }
    hideEmpty();
    currentBadges.forEach(function (badge) {
      badgeList.appendChild(createCard(badge));
    });
  }
  function loadBadges() {
    if (loading) {
      return;
    }
    loading = true;
    refreshButton.disabled = true;
    refreshButton.style.opacity = "0.6";
    setStatus("Refreshing badges...", false);
    var oldCards = badgeList.querySelectorAll(".badge-card");
    if (!oldCards.length) {
      showEmpty("Loading badges...", "Connecting to The Hollow.", false);
    }
    requestJson(makeUrl("checkBadges"))
      .then(function (data) {
        if (!data || data.success !== true || !Array.isArray(data.badges)) {
          throw new Error(
            data && data.error
              ? data.error
              : "The server returned an unexpected response."
          );
        }
        renderBadges(data.badges);
        setStatus("", false);
      })
      .catch(function (error) {
        setStatus(error.message || "Could not load badges.", true);
        if (!oldCards.length) {
          showEmpty(
            "Could not load badges",
            error.message || "Please check your connection and try again.",
            true
          );
        }
      })
      .finally(function () {
        loading = false;
        refreshButton.disabled = false;
        refreshButton.style.opacity = "1";
      });
  }
  function claimReward(badge, button) {
    if (button.disabled) {
      return;
    }
    button.disabled = true;
    button.textContent = "...";
    requestJson(makeUrl("claimBadge", {
      badgeId: String(badge.id)
    }))
      .then(function (data) {
        if (!data || data.success !== true) {
          throw new Error(
            data && data.error
              ? data.error
              : "The reward could not be claimed."
          );
        }
        badge.claimed = true;
        setStatus("Reward claimed successfully.", false);
        renderBadges(currentBadges);
      })
      .catch(function (error) {
        button.disabled = false;
        button.textContent = "CLAIM";
        setStatus(error.message || "Claim failed. Please try again.", true);
      });
  }
  refreshButton.addEventListener("click", loadBadges);
  retryButton.addEventListener("click", loadBadges);
  loadBadges();
})();
</script>
</body>
</html>
